[project]
name = "aether-agent"
version = "0.1.0"
description = "Aether — a continuous, cross-platform personal action agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",  # FastAPI's multipart/form parsing for the capture upload
    "uvicorn[standard]>=0.30",
    "asyncpg>=0.30",
    "cryptography>=44",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",  # secret_env reads .env on demand (dotenv_values)
    "httpx>=0.27",
    "tenacity>=9",
    "rapidfuzz>=3.10",
    "pyyaml>=6.0",
    "anthropic>=1.0",
    "openai>=1.60",
    "google-genai>=1.0",
    "mcp>=2.0",
    "composio>=0.22.1",  # the one connection hub for external apps — sessions + hosted MCP
    "python-telegram-bot>=22.0",
    "py-cord>=2.6",
    "slack-bolt>=1.20",
    "pypdf>=5.0",  # text extraction from shared PDFs (chat attachments)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
]

[project.scripts]
aether = "aether.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aether"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires AETHER_TEST_DATABASE_URL (a throwaway Postgres)",
    "e2e: browser end-to-end tests against the dev fixture server (requires `playwright install chromium`)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = [
    "E501",  # line length is a formatter concern, not a lint failure
]

[tool.ruff.lint.isort]
known-first-party = ["aether"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom is `param: T = File(...)` / `= Form(...)` /
# `= Depends(...)` — a function call in a default is the documented API, not a bug.
"src/aether/api/routes.py" = ["B008"]

# CI — the same gauntlet CONTRIBUTING.md asks a contributor to run locally,
# automated on every pull request:
#   ruff lint + format, unit tests (Python 3.12 & 3.14), integration tests
#   against a containerized Postgres, the webapp build, and the browser e2e
#   suite under Chromium.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # manual runs from the Actions tab

permissions:
  contents: read

# a new push to the same PR supersedes the run in flight
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff check + format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --output-format=github . # errors also show inline on the PR
      - run: ruff format --check .

  unit-tests:
    name: unit tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"] # the declared floor and the version development runs on
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-glob: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m "not integration and not e2e"

  integration-tests:
    name: integration tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # tests/conftest.py migrates and truncates this database itself
      AETHER_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-glob: pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -m integration

  webapp-build:
    name: webapp build (Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: npm ci
      - run: npm run build # outputs to src/aether/web/ — the FastAPI-served panel

  e2e-tests:
    name: e2e tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-glob: pyproject.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webapp/package-lock.json
      - run: pip install -e ".[dev]"
      - name: Build the panel (the e2e suite skips without it)
        run: npm ci && npm run build
        working-directory: webapp
      - run: playwright install chromium --with-deps
      - run: pytest -m e2e
        env:
          AETHER_TEST_E2E: "1"
